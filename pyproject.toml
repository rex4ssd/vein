[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lode-vein"
version = "0.1.0"
description = "Decision & debug lore archive for AI-assisted development"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "rich>=13.0",
    "mcp>=1.0",          # MCP server (vein mcp) — core value, always included
]

[project.optional-dependencies]
# sqlite-vec: vector/semantic search via ollama embedding re-rank.
# FTS5 keyword search works without it. Only add if you want full semantic search.
search = ["sqlite-vec>=0.1"]

# markitdown: import Word/PDF/HTML into .vein/ via `vein import`.
# Not needed if you only import plain markdown files.
import-tools = ["markitdown>=0.0.1"]

# all: everything above for power users
all = ["sqlite-vec>=0.1", "markitdown>=0.0.1"]

dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[project.scripts]
vein = "vein.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
